<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting Down For You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #8e7fa6; /* The matching lilac purple */
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #ffffff;
            text-align: center;
            overflow-x: hidden;
        }

        /* Soft background glow */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(0,0,0,0.18) 100%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 600px;
            padding: 40px 25px;
            box-sizing: border-box;
            animation: fadeInPage 2s ease-out forwards;
        }

        .title {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 2.5rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Elegant flex layout for the countdown boxes */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 2.5rem;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }

        .number {
            font-size: 3.5rem;
            font-weight: bold;
            /* White glowing effect matching the calligraphy style */
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8), 
                0 0 20px rgba(255, 255, 255, 0.4);
        }

        .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
            opacity: 0.8;
        }

        /* Romantic blessing/quote underneath */
        .subtext {
            font-size: 1.25rem;
            font-style: italic;
            line-height: 1.6;
            opacity: 0.9;
            max-width: 450px;
            margin: 0 auto;
        }

        /* Elegant fade-in for the whole page */
        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .title { font-size: 1.5rem; }
            .countdown-container { gap: 12px; }
            .number { font-size: 2.25rem; }
            .label { font-size: 0.75rem; }
            .subtext { font-size: 1rem; max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="container">
        <div class="title" id="countdownTitle">Counting down to your special day...</div>
        
        <div class="countdown-container" id="timerContainer">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Mins</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Secs</span>
            </div>
        </div>

        <div class="subtext" id="countdownSubtext">
            "May Allah bless your upcoming year with endless peace, health, and beautiful answers to all your hidden du'as."
        </div>
    </div>

    <script>
        function updateCountdown() {
            const currentYear = new Date().getFullYear();
            // Sets target to June 2nd at midnight of the current year
            const birthdayTarget = new Date(`June 2, ${currentYear} 00:00:00`).getTime();
            const now = new Date().getTime();
            const difference = birthdayTarget - now;

            // If the birthday has arrived or passed
            if (difference <= 0) {
                clearInterval(intervalId);
                document.getElementById('timerContainer').style.display = 'none';
                document.getElementById('countdownTitle').innerHTML = "✨ Happy Birthday, Zunaira! ✨";
                document.getElementById('countdownTitle').style.fontSize = "2.5rem";
                document.getElementById('countdownTitle').style.textShadow = "0 0 15px rgba(255,255,255,0.9)";
                document.getElementById('countdownSubtext').innerText = "Alhamdulillah for another beautiful year of your life. Praying that this year brings you absolute happiness, tranquility, and that all your sweetest dreams unfold gracefully. May our future together be blessed beautifully.";
                return;
            }

            // Math calculations for days, hours, minutes, and seconds
            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            // Output the results into the HTML, formatting with a leading zero if under 10
            document.getElementById('days').innerText = d < 10 ? '0' + d : d;
            document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
            document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
            document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
        }

        // Run immediately, then refresh every single second
        updateCountdown();
        const intervalId = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
